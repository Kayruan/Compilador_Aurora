# Compila o compilador Aurora e roda os testes automáticos a cada push e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Compilar e testar (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Flex e Bison
        run: sudo apt-get update && sudo apt-get install -y flex bison

      - name: Compilar (bison + flex + gcc)
        run: make

      - name: Rodar os testes
        run: make testar
